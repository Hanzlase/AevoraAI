[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aevora-ai"
version = "0.1.0"
description = "Multilingual WhatsApp clinic receptionist assistant for NovaCare Medical Centre"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Aevora AI Team" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "google-genai>=0.1.0",
    "faster-whisper>=1.0.0",
    "imageio-ffmpeg>=0.4.9",
    "edge-tts>=6.1.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]

target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends pattern)
    "E501",  # line too long (handled by ruff format / natural text blocks)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
